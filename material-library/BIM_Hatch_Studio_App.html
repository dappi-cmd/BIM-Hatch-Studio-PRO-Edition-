<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIM Hatch Studio - Standalone UI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Konva & React-Konva -->
    <script src="https://unpkg.com/konva@9/konva.min.js"></script>
    <script src="https://unpkg.com/react-konva@18.2.10/react-konva.min.js"></script>
    
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { Stage, Layer, Line, Rect, Circle } = ReactKonva;

    // PAT Math Generator Logic
    class PatGenerator {
        static generate(lines, patternName) {
            const patLines = [];
            patLines.push(`*${patternName}, Seamless Pattern Generated by BIM Hatch Studio`);
            patLines.push(`;%TYPE=MODEL`);
            
            lines.forEach(line => {
                const dx = line.points[2] - line.points[0];
                const dy = line.points[3] - line.points[1];
                let angle = Math.atan2(dy, dx) * (180 / Math.PI);
                if (angle < 0) angle += 360;
                
                const length = Math.sqrt(dx*dx + dy*dy);
                
                // Format: angle, x, y, deltax, deltay, dash...
                // Simplified math for demo
                const patLine = `${angle.toFixed(2)}, ${line.points[0].toFixed(2)},${line.points[1].toFixed(2)}, 0,100, ${length.toFixed(2)},-${length.toFixed(2)}`;
                patLines.push(patLine);
            });
            patLines.push('');
            return patLines.join('\n');
        }
    }

    function App() {
        const [lines, setLines] = useState([]);
        const [isDrawing, setIsDrawing] = useState(false);
        const [patternName, setPatternName] = useState('BIM_PATTERN_001');
        const [patOutput, setPatOutput] = useState('');
        const stageRef = useRef(null);

        // Update PAT code whenever lines change
        useEffect(() => {
            setPatOutput(PatGenerator.generate(lines, patternName));
        }, [lines, patternName]);

        const handleMouseDown = (e) => {
            setIsDrawing(true);
            const pos = e.target.getStage().getPointerPosition();
            setLines([...lines, { points: [pos.x, pos.y, pos.x, pos.y], id: Date.now().toString() }]);
        };

        const handleMouseMove = (e) => {
            if (!isDrawing) return;
            const stage = e.target.getStage();
            const point = stage.getPointerPosition();
            let lastLine = lines[lines.length - 1];
            lastLine.points[2] = point.x;
            lastLine.points[3] = point.y;
            
            // replace last
            lines.splice(lines.length - 1, 1, lastLine);
            setLines(lines.concat());
        };

        const handleMouseUp = () => {
            setIsDrawing(false);
        };

        const downloadPAT = () => {
            const blob = new Blob([patOutput], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${patternName}.pat`;
            a.click();
            URL.revokeObjectURL(url);
        };

        const clearCanvas = () => {
            setLines([]);
        };

        return (
            <div className="h-screen w-full flex flex-col">
                <header className="h-14 border-b border-slate-800 bg-slate-900 flex items-center justify-between px-6">
                    <div className="flex items-center gap-3">
                        <div className="w-8 h-8 bg-sky-500 rounded flex items-center justify-center font-bold text-white shadow-[0_0_15px_rgba(14,165,233,0.5)]">B</div>
                        <h1 className="text-xl font-semibold tracking-tight">BIM Hatch Studio - Standalone UI</h1>
                    </div>
                    <button onClick={downloadPAT} className="px-4 py-2 text-sm bg-sky-600 hover:bg-sky-500 text-white font-medium rounded-md shadow-lg shadow-sky-500/20 transition-all">
                        Download .PAT File
                    </button>
                </header>

                <div className="flex-1 flex overflow-hidden">
                    {/* Left Toolbar */}
                    <aside className="w-16 border-r border-slate-800 bg-slate-900 flex flex-col items-center py-4 gap-4">
                        <button className="w-10 h-10 rounded bg-sky-600 flex items-center justify-center cursor-pointer shadow-lg shadow-sky-500/20" title="Draw Line Tool">
                            <span className="text-xl">╱</span>
                        </button>
                        <button onClick={clearCanvas} className="w-10 h-10 rounded bg-slate-800 flex items-center justify-center cursor-pointer hover:bg-red-500/20 hover:text-red-400 border border-slate-700 transition" title="Clear Canvas">
                            <span className="text-sm font-bold">X</span>
                        </button>
                    </aside>

                    {/* Canvas Area */}
                    <section className="flex-1 p-4 bg-slate-950 flex flex-col relative" id="canvas-container">
                        <div className="absolute top-6 left-6 text-slate-500 text-sm z-10 pointer-events-none">
                            Click and drag to draw pattern lines. Math will update in real-time.
                        </div>
                        <div className="flex-1 border border-slate-700 rounded-lg overflow-hidden bg-slate-900 cursor-crosshair">
                            <Stage 
                                width={1200} 
                                height={800} 
                                onMouseDown={handleMouseDown}
                                onMousemove={handleMouseMove}
                                onMouseup={handleMouseUp}
                                ref={stageRef}
                            >
                                <Layer>
                                    {/* Grid Lines */}
                                    {Array.from({ length: 40 }).map((_, i) => (
                                        <React.Fragment key={'grid'+i}>
                                            <Line points={[0, i * 40, 1200, i * 40]} stroke="#1e293b" strokeWidth={1} />
                                            <Line points={[i * 40, 0, i * 40, 800]} stroke="#1e293b" strokeWidth={1} />
                                        </React.Fragment>
                                    ))}
                                    
                                    {/* Drawn Lines */}
                                    {lines.map((line, i) => (
                                        <Line
                                            key={i}
                                            points={line.points}
                                            stroke="#38bdf8"
                                            strokeWidth={3}
                                            lineCap="round"
                                            lineJoin="round"
                                        />
                                    ))}
                                </Layer>
                            </Stage>
                        </div>
                    </section>

                    {/* Right Properties Panel */}
                    <aside className="w-80 border-l border-slate-800 bg-slate-900 flex flex-col">
                        <div className="p-4 border-b border-slate-800">
                            <h2 className="font-semibold text-slate-100 mb-4">Properties</h2>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">Pattern Name</label>
                                    <input 
                                        type="text" 
                                        value={patternName}
                                        onChange={(e) => setPatternName(e.target.value)}
                                        className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm focus:outline-none focus:border-sky-500 text-slate-200" 
                                    />
                                </div>
                            </div>
                        </div>

                        <div className="p-4 flex-1 flex flex-col">
                            <h2 className="font-semibold text-slate-100 mb-2">Live .PAT Code</h2>
                            <p className="text-xs text-slate-500 mb-2">This math updates as you draw.</p>
                            <pre className="flex-1 bg-slate-950 border border-slate-800 rounded p-3 text-xs text-emerald-400 font-mono overflow-y-auto whitespace-pre-wrap">
                                {patOutput}
                            </pre>
                        </div>
                    </aside>
                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
